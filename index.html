<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Portal Kampus Lintang</title>
<style>
:root{--bg:#eef2f7;--ink:#0e1b33;--mut:#5a6784;--pri:#2b3a8c;--pri2:#1e2a6b;--acc:#e8a317;--line:#d9e0ec;--bad:#b42318;--ok:#157347}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3,.brand{font-family:Georgia,"Iowan Old Style",serif;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--pri2);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;display:flex;gap:10px;align-items:center}
.logo{width:30px;height:30px;border-radius:8px 8px 8px 0;background:var(--acc);color:var(--pri2);display:grid;place-items:center;font-weight:800}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:8px;color:#c7d0ee;text-decoration:none;font-weight:600;font-size:14px}
nav a:hover,nav a.on{background:rgba(255,255,255,.12);color:#fff}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px}
.pill.v{background:#fde4e1;color:var(--bad)}.pill.a{background:#d8f3e3;color:var(--ok)}
.who{font-size:14px}.who small{opacity:.7}
main{max-width:1080px;margin:auto;padding:30px 20px 50px}
h1{font-size:30px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.card h3{margin:0 0 4px;font-size:16px;color:var(--mut);font-family:system-ui,sans-serif;font-weight:600}
.stat{font-family:Georgia,serif;font-size:38px;color:var(--pri)}
.gap{margin-top:16px}.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #c3cde0;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
button{background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
button:hover{background:var(--pri2)}
button.ghost{background:rgba(255,255,255,.14);margin:0;padding:7px 14px}
button.del{background:#fde4e1;color:var(--bad);margin:0;padding:6px 12px}
.post{padding:14px 0;border-bottom:1px solid var(--line)}.post:last-child{border:0}
.post small{color:var(--mut);margin-left:8px}.post p{margin:6px 0 0;max-width:70ch}
.msg{padding:10px 14px;border-radius:8px;margin-top:12px;font-size:14px}
.msg.e{background:#fde4e1;color:var(--bad)}.msg.o{background:#d8f3e3;color:var(--ok)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--pri2);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.hero h1{font-size:44px;line-height:1.1;max-width:12ch}
.ktm{width:300px;max-width:100%;background:#fff;color:var(--ink);border-radius:14px;padding:18px;transform:rotate(-3deg);box-shadow:0 18px 40px rgba(0,0,0,.3)}
.ktm .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ktm .ph{width:56px;height:68px;border-radius:6px;background:linear-gradient(var(--line),#b9c4dd);margin:12px 0}
.ktm b{font-family:Georgia,serif;font-size:18px}.ktm div.bd{height:6px;background:var(--acc);border-radius:3px;margin-top:12px}
.form{display:flex;flex-direction:column;justify-content:center;padding:60px;max-width:500px;width:100%;margin:auto}
.form h2{margin:0 0 4px;font-size:28px}
.demo{margin-top:22px;font-size:13px;color:var(--mut);background:#fff;border:1px dashed #aab7d4;border-radius:10px;padding:12px 14px;line-height:1.7}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 0 24px}
@media(max-width:800px){.login{grid-template-columns:1fr}.hero{padding:36px 24px}.hero h1{font-size:32px}.form{padding:32px 24px}}
</style></head><body><div id="app"></div>
<script>
const MODE="rentan";
const $=s=>document.querySelector(s), app=$("#app");
const store=f=>({g:k=>{try{return JSON.parse(f().getItem(k))}catch(e){return null}},s:(k,v)=>{try{f().setItem(k,JSON.stringify(v))}catch(e){}}});
const L=store(()=>localStorage), SS=store(()=>sessionStorage);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MK=["Keamanan Sistem Informasi","Basis Data"], now=()=>new Date().toLocaleString("id-ID");
const seed={users:[
{id:1,nama:"Raka Pratama",user:"raka",pass:"mhs123",role:"mahasiswa"},
{id:2,nama:"Sari Wulandari",user:"sari",pass:"mhs456",role:"mahasiswa"},
{id:3,nama:"Dr. Budi Santoso",user:"budi",pass:"dosen123",role:"dosen"},
{id:4,nama:"Admin Portal",user:"admin",pass:"admin123",role:"admin"}],
grades:[{uid:1,mk:MK[0],nilai:85},{uid:1,mk:MK[1],nilai:78},{uid:2,mk:MK[0],nilai:91},{uid:2,mk:MK[1],nilai:88}],
posts:[{id:1,uid:3,teks:"Selamat datang di forum diskusi KSI. Silakan bertanya.",waktu:"-"}],tasks:[]};
let db=L.g("pk_db_"+MODE)||structuredClone(seed), me=null;
const save=()=>L.s("pk_db_"+MODE,db);

const out=t=>t;               // KERENTANAN: keluaran tidak di-encode (Stored XSS)
const can=r=>true;            // KERENTANAN: tidak ada pengecekan peran (eskalasi hak akses)
const need=r=>can(r)||(deny(),false);

function login(u,p){
  const x=db.users.find(a=>a.user===u&&a.pass===p);
  if(!x){
    return "Username atau sandi salah.";
  }
  SS.s("uid",x.id); return null;
}

function nav(){
  const l=[["beranda","Beranda"],["forum","Diskusi"]];
  if(me.role==="mahasiswa")l.push(["nilai/"+me.id,"Nilai saya"],["tugas","Tugas"]);
  if(me.role==="dosen")l.push(["beri-nilai","Beri nilai"]);
  if(me.role==="admin")l.push(["admin","Kelola akun"]);
  return l.map(([h,t])=>`<a href="#/${h}" class="${location.hash==="#/"+h?"on":""}">${t}</a>`).join("");
}
function badge(){return MODE==="aman"?'<span class="pill a">Versi aman</span>':'<span class="pill v">Versi rentan (latihan)</span>'}
function shell(h,sub,body){
  app.innerHTML=`<header><div class="bar"><div class="brand"><span class="logo">L</span>Portal Kampus Lintang</div><nav>${nav()}</nav>${badge()}<span class="who">${esc(me.nama)} <small>(${me.role})</small></span><button class="ghost" data-act="out">Keluar</button></div></header><main><h1>${h}</h1><p class="sub">${sub}</p>${body}</main><footer>Proyek latihan KSI. Seluruh akun dan data bersifat sintetis.</footer>`;
}
const deny=()=>shell("Akses ditolak","","<div class='card'><div class='msg e'>Anda tidak berhak membuka halaman ini.</div></div>");
const sel=(id,arr)=>`<select id="${id}">${arr.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`;
const mkSel=()=>sel("mk",MK.map(m=>[m,m]));

function loginView(msg){
  app.innerHTML=`<div class="login"><section class="hero"><h1>Nilai, tugas, dan diskusi di satu tempat.</h1><div class="ktm"><div class="top"><span>Kartu Tanda Mahasiswa</span><span>Lintang</span></div><div class="ph"></div><b>Mahasiswa Contoh</b><div style="font-size:13px;color:var(--mut)">NIM 0000000000</div><div class="bd"></div></div></section>
  <section class="form"><h2>Masuk ke portal</h2><p class="sub">Gunakan akun yang diberikan kampus.</p>
  <label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp">Sandi</label><input id="lp" type="password" autocomplete="current-password">
  <button data-act="in">Masuk</button>${msg?`<div class="msg e">${esc(msg)}</div>`:""}
  <div class="demo"><b>Akun demo (sintetis)</b><br>Mahasiswa: raka / mhs123, sari / mhs456<br>Dosen: budi / dosen123<br>Admin: admin / admin123</div>
  <div style="margin-top:16px">${badge()}</div></section></div>`;
}
function home(){
  shell("Halo, "+esc(me.nama.split(" ")[0]),"Ringkasan portal hari ini.",`<div class="grid"><div class="card"><h3>Pesan diskusi</h3><div class="stat">${db.posts.length}</div></div><div class="card"><h3>Tugas terkumpul</h3><div class="stat">${db.tasks.length}</div></div><div class="card"><h3>Akun terdaftar</h3><div class="stat">${db.users.length}</div></div></div>`);
}
function nilai(arg){
  const uid=+arg||me.id;
  const u=db.users.find(x=>x.id===uid);
  if(!u)return shell("Tidak ditemukan","","<div class='card'>Data tidak ada.</div>");
  const rows=db.grades.filter(g=>g.uid===uid).map(g=>`<tr><td>${esc(g.mk)}</td><td>${g.nilai}</td></tr>`).join("")||"<tr><td colspan=2>Belum ada nilai.</td></tr>";
  shell("Nilai: "+esc(u.nama),"Transkrip semester berjalan.",`<div class="card wrap"><table><tr><th>Mata kuliah</th><th>Nilai</th></tr>${rows}</table></div>`);
}
function forum(){
  const ps=db.posts.slice().reverse().map(p=>{const a=db.users.find(u=>u.id===p.uid)||{nama:"?"};return `<div class="post"><b>${out(a.nama)}</b><small>${p.waktu}</small><p>${out(p.teks)}</p></div>`}).join("");
  shell("Diskusi","Tanya jawab antara mahasiswa dan dosen.",`<div class="card"><label for="t">Tulis pesan</label><textarea id="t"></textarea><button data-act="post">Kirim pesan</button></div><div class="card gap">${ps}</div>`);
}
function tugas(){
  const rows=db.tasks.filter(t=>t.uid===me.id).map(t=>`<tr><td>${esc(t.file)}</td><td>${esc(t.mk)}</td><td>${t.waktu}</td></tr>`).join("")||"<tr><td colspan=3>Belum ada berkas. Unggah tugas pertama Anda.</td></tr>";
  shell("Unggah tugas","Kumpulkan tugas mata kuliah.",`<div class="card"><label for="mk">Mata kuliah</label>${mkSel()}<label for="f">Berkas</label><input type="file" id="f"><button data-act="up">Unggah tugas</button><div id="m"></div></div><div class="card gap wrap"><table><tr><th>Berkas</th><th>Mata kuliah</th><th>Waktu</th></tr>${rows}</table></div>`);
}
function beri(){
  if(!need(["dosen","admin"]))return;
  const rows=db.grades.map(g=>`<tr><td>${esc((db.users.find(u=>u.id===g.uid)||{}).nama||"?")}</td><td>${esc(g.mk)}</td><td>${g.nilai}</td></tr>`).join("");
  shell("Beri nilai","Input nilai mahasiswa.",`<div class="card"><label for="u">Mahasiswa</label>${sel("u",db.users.filter(u=>u.role==="mahasiswa").map(u=>[u.id,u.nama]))}<label for="mk">Mata kuliah</label>${mkSel()}<label for="n">Nilai (0-100)</label><input id="n" type="number" min="0" max="100"><button data-act="grade">Simpan nilai</button><div id="m"></div></div><div class="card gap wrap"><table><tr><th>Mahasiswa</th><th>Mata kuliah</th><th>Nilai</th></tr>${rows}</table></div>`);
}
function admin(){
  if(!need(["admin"]))return;
  const rows=db.users.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.user)}</td><td><select data-role="${u.id}" aria-label="Peran ${esc(u.nama)}">${["mahasiswa","dosen","admin"].map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select></td><td><button class="del" data-del="${u.id}">Hapus</button></td></tr>`).join("");
  shell("Kelola akun","Atur peran dan hapus akun.",`<div class="card wrap"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${rows}</table></div><div class="card gap"><h3>Tambah akun mahasiswa</h3><div class="grid"><div><label for="an">Nama</label><input id="an"></div><div><label for="au">Username</label><input id="au"></div><div><label for="ap">Sandi</label><input id="ap" type="password"></div></div><button data-act="add">Tambah akun</button><div id="m"></div></div>`);
}
function route(){
  const [,pg,arg]=location.hash.split("/");
  me=db.users.find(u=>u.id===SS.g("uid"));
  if(!me)return loginView();
  const r={beranda:home,nilai:()=>nilai(arg),forum,tugas,"beri-nilai":beri,admin}[pg];
  (r||home)();
}
const msg=(t,ok)=>{const m=$("#m");if(m)m.innerHTML=`<div class="msg ${ok?"o":"e"}">${esc(t)}</div>`};
const v=id=>(document.getElementById(id)||{}).value||"";
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-del]"); if(!b)return;
  const a=b.dataset.act;
  if(a==="in"){const r=login(v("lu").trim(),v("lp"));if(r)loginView(r);else{location.hash="#/beranda";route()}}
  else if(a==="out"){SS.s("uid",null);location.hash="#/masuk";route()}
  else if(a==="post"){const t=v("t").trim();if(!t)return;db.posts.push({id:Date.now(),uid:me.id,teks:t,waktu:now()});save();forum()}
  else if(a==="up"){const f=$("#f").files[0];if(!f)return msg("Pilih berkas terlebih dahulu.");db.tasks.push({uid:me.id,file:f.name,mk:v("mk"),waktu:now()});save();tugas();msg("Tugas berhasil diunggah.",1)}
  else if(a==="grade"){if(!can(["dosen","admin"]))return;const n=+v("n");if(v("n")===""||n<0||n>100)return msg("Nilai harus antara 0 dan 100.");db.grades.push({uid:+v("u"),mk:v("mk"),nilai:n});save();beri();msg("Nilai tersimpan.",1)}
  else if(a==="add"){if(!can(["admin"]))return;const n=v("an").trim(),u=v("au").trim(),p=v("ap");if(!n||!u||p.length<6)return msg("Isi semua kolom; sandi minimal 6 karakter.");if(db.users.some(x=>x.user===u))return msg("Username sudah dipakai.");db.users.push({id:Date.now(),nama:n,user:u,pass:p,role:"mahasiswa"});save();admin();msg("Akun ditambahkan.",1)}
  else if(b.dataset.del){if(!can(["admin"]))return;const id=+b.dataset.del;if(id===me.id)return;db.users=db.users.filter(x=>x.id!==id);db.grades=db.grades.filter(g=>g.uid!==id);save();admin()}
});
document.addEventListener("change",e=>{
  const s=e.target.closest("[data-role]"); if(!s||!can(["admin"]))return;
  const u=db.users.find(x=>x.id===+s.dataset.role); if(u){u.role=s.value;save();route()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="lp"||e.target.id==="lu"))document.querySelector('[data-act="in"]').click()});
addEventListener("hashchange",route);
route();
</script></body></html>
